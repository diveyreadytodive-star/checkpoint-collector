# CHECKPOINT 11팀 - 경기 광역버스(+따릉이) 출퇴근 자동 수집
# 평일 출근 06~10시, 퇴근 16~21시(KST)에 GitHub 서버에서 돌고, 끝나면 data/ 를 저장소에 커밋합니다.
# 필요한 Secret: GG_KEY (필수, 공공데이터포털 Decoding 키)
name: collect

on:
  schedule:
    # GitHub cron은 UTC 기준(KST = UTC+9)이고 수 시간씩 늦거나 빠지기도 해서, 창마다 여러 번 걸어 둠.
    # concurrency로 한 번에 하나만 돌고, 이미 끝난 창에 뒤늦게 시작한 실행은 바로 종료됨.
    - cron: "50 20 * * 0-4"   # KST 월~금 05:50
    - cron: "50 21 * * 0-4"   # 06:50
    - cron: "50 22 * * 0-4"   # 07:50
    - cron: "50 23 * * 0-4"   # 08:50
    - cron: "50 6 * * 1-5"    # 15:50
    - cron: "50 7 * * 1-5"    # 16:50
    - cron: "50 8 * * 1-5"    # 17:50
    - cron: "50 9 * * 1-5"    # 18:50
    - cron: "50 10 * * 1-5"   # 19:50
  workflow_dispatch:          # Actions 탭에서 수동 실행(테스트용)
    inputs:
      until_hour:
        description: "몇 시(KST)에 끝낼지"
        default: "21"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Seoul
      MAX_MINUTES: "325"
      GG_KEY: ${{ secrets.GG_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 종료 시각 정하기
        run: |
          H=$(date +%H)
          if [ -n "${{ github.event.inputs.until_hour }}" ]; then U=${{ github.event.inputs.until_hour }};
          elif [ "$H" -lt 12 ]; then U=10; else U=21; fi
          echo "RUN_UNTIL_HOUR=$U" >> "$GITHUB_ENV"
          # 창 시작보다 1시간 넘게 일찍 깨어난 실행은 시간 제한만 소모하므로 바로 종료(다음 예약이 이어받음)
          if [ -z "${{ github.event.inputs.until_hour }}" ]; then
            if [ "$H" -lt 12 ]; then S=6; else S=16; fi
            if [ $((10#$H)) -lt $((S-1)) ] || [ $((10#$H)) -ge "$U" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "창 밖 실행 → 건너뜀"; fi
          fi
          echo "now=$(date '+%F %T %Z'), until=$U"

      - name: API 연결 확인 (해외 IP 차단 여부)
        if: env.SKIP != '1'
        run: |
          curl -s -o /dev/null -w "data.go.kr HTTP %{http_code}\n" \
            "https://apis.data.go.kr/6410000/busstationservice/v2/getBusStationViaRouteListv2?serviceKey=${GG_KEY}&stationId=102000070&format=json" || true

      - name: 수집 (경기버스 코스)
        if: env.SKIP != '1'
        run: |
          python3 course_collect.py &
          BUS=$!
          python3 station_collect.py &
          ST=$!
          python3 seoul_collect.py &
          SE=$!
          python3 seoul_bus_collect.py &
          SB=$!
          wait $BUS || true
          wait $ST || true
          wait $SE || true
          wait $SB || true

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data || true
          git commit -m "data: $(date '+%F %H:%M') 수집분" || echo "변경 없음"
          git pull --rebase || true
          git push || true
