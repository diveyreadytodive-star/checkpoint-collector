name: task
on:
  push:
    paths: ["tasks/run.txt"]
  workflow_dispatch:
    inputs:
      script: { description: "실행할 파이썬 파일", required: true, default: "discover.py" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      GG_KEY: ${{ secrets.GG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          S="${{ inputs.script }}"; [ -z "$S" ] && S=$(head -1 tasks/run.txt)
          echo "실행: $S"; python3 "$S"
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "collector-bot"; git config user.email "collector-bot@users.noreply.github.com"
          git add data || true
          git commit -m "task: ${{ inputs.script }}" || echo "변경 없음"
          git pull --rebase -q origin main && git push -q origin HEAD:main
